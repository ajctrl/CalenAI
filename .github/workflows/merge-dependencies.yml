name: Merge tested Composer updates
on:
  workflow_run:
    workflows: [CalenAI tests]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/composer/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the tested revision of an open Dependabot PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ -n "$PR" ]] || exit 0
          pr_data=$(gh api "repos/$REPO/pulls/$PR")
          jq -e --arg sha "$SHA" --arg repo "$REPO" '
            .state == "open" and .draft == false and .user.login == "dependabot[bot]"
            and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha
          ' <<< "$pr_data" > /dev/null || exit 0
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' |
            awk '!/^composer\.(json|lock)$/ {unexpected=1} END {exit unexpected || NR == 0}'
          gh api --method PUT "repos/$REPO/pulls/$PR/merge" -f sha="$SHA" -f merge_method=squash
