name: CalenAI tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test

  nextcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start Nextcloud 35 with the distribution files
        run: |
          mkdir "$RUNNER_TEMP/calenai"
          git archive HEAD appinfo css img js lib templates | tar -x -C "$RUNNER_TEMP/calenai"
          docker run -d --name calenai-nc -p 127.0.0.1:8080:80 \
            --add-host=host.docker.internal:host-gateway \
            -v "$RUNNER_TEMP/calenai:/var/www/html/custom_apps/calenai" \
            -e SQLITE_DATABASE=nextcloud -e NEXTCLOUD_ADMIN_USER=admin \
            -e NEXTCLOUD_ADMIN_PASSWORD='Adm1n-CalenAI-test!' \
            -e NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud:35
          curl --retry 90 --retry-delay 2 --retry-all-errors -fsS http://localhost:8080/status.php
          docker exec -u www-data calenai-nc php occ app:enable calenai
          docker exec -u www-data -e OC_PASS='Alice-CalenAI-test!1' calenai-nc php occ user:add --password-from-env alice
          docker exec -u www-data -e OC_PASS='Bob-CalenAI-test!1' calenai-nc php occ user:add --password-from-env bob
      - name: Run calendar scenarios with a local AI fixture
        run: |
          python3 tests/e2e/mock_ai.py 8765 tests/e2e/requests.jsonl &
          python3 tests/e2e/run.py tests/e2e
