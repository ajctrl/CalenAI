name: CalenAI tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer lint
      - run: composer test

  discover:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.schedule.outputs.plan }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: schedule
        name: Read Nextcloud's stable releases and check the version bump
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/wiki/nextcloud/server/Maintenance-and-Release-Schedule.md -o "$RUNNER_TEMP/schedule.md"
          args=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            git show "$BASE:appinfo/info.xml" > "$RUNNER_TEMP/base-info.xml"
            args+=(--base-info "$RUNNER_TEMP/base-info.xml")
          fi
          plan=$(python3 scripts/compatibility.py plan "$RUNNER_TEMP/schedule.md" "${args[@]}")
          echo "$plan"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  nextcloud:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.discover.outputs.plan).matrix }}
    env:
      SERVER: ${{ matrix.server }}
      PLAN: ${{ needs.discover.outputs.plan }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Install the packaged app on the selected Nextcloud release
        run: |
          release_dir="$RUNNER_TEMP/release"
          version=$(scripts/package-release "$release_dir")
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          archive="$release_dir/calenai-$version.tar.gz"
          low=$(jq -r .low <<< "$PLAN")
          high=$(jq -r .high <<< "$PLAN")
          python3 scripts/compatibility.py verify "$archive" "$(jq -r .version <<< "$PLAN")" "$low" "$high"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          major=${SERVER%%.*}
          if (( major < low || major > high )); then
            python3 scripts/compatibility.py update "$RUNNER_TEMP/calenai/appinfo/info.xml" \
              "$(jq -r .next_version <<< "$PLAN")" "$(jq -r .minimum <<< "$PLAN")" "$(jq -r .maximum <<< "$PLAN")"
          fi
          cat > "$RUNNER_TEMP/provision.sh" <<'SH'
          #!/bin/sh
          set -eu
          php occ app:enable calenai
          OC_PASS='Alice-CalenAI-test!1' php occ user:add --password-from-env alice
          OC_PASS='Bob-CalenAI-test!1' php occ user:add --password-from-env bob
          SH
          chmod 755 "$RUNNER_TEMP/provision.sh"
          docker run -d --name calenai-nc -p 127.0.0.1:8080:80 \
            --add-host=host.docker.internal:host-gateway \
            -v "$GITHUB_WORKSPACE:/opt/calenai-tests:ro" \
            -v "$RUNNER_TEMP/calenai:/var/www/html/custom_apps/calenai" \
            -v "$RUNNER_TEMP/provision.sh:/docker-entrypoint-hooks.d/post-installation/provision.sh:ro" \
            -e SQLITE_DATABASE=nextcloud -e NEXTCLOUD_ADMIN_USER=admin \
            -e NEXTCLOUD_ADMIN_PASSWORD='Adm1n-CalenAI-test!' \
            -e NEXTCLOUD_TRUSTED_DOMAINS=localhost "nextcloud:$SERVER-apache"
          curl --retry 90 --retry-delay 2 --retry-all-errors -fsS http://localhost:8080/status.php |
            jq -e --arg version "$SERVER" '.installed and .versionstring == $version'
          docker exec -u www-data calenai-nc php occ app:list --enabled --output=json |
            jq -e '.enabled | has("calenai")'
      - name: Run unit tests with the installed server's public API
        run: |
          docker exec -w /opt/calenai-tests calenai-nc php vendor/bin/phpunit \
            --do-not-cache-result --bootstrap tests/nextcloud-bootstrap.php
      - name: Run calendar scenarios with a local AI fixture
        run: |
          python3 tests/e2e/mock_ai.py 8765 tests/e2e/requests.jsonl &
          python3 tests/e2e/run.py tests/e2e
      - name: Diagnose Nextcloud startup
        if: failure()
        run: |
          docker logs --tail 60 calenai-nc
          docker exec -u www-data calenai-nc php occ app:list --enabled
          docker exec -u www-data calenai-nc php occ router:list calenai

  propose:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      fromJSON(needs.discover.outputs.plan).version != fromJSON(needs.discover.outputs.plan).next_version
    needs: [discover, unit, nextcloud]
    runs-on: ubuntu-latest
    concurrency: nextcloud-compatibility-pr
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the tested compatibility change
        env:
          PLAN: ${{ needs.discover.outputs.plan }}
        run: |
          python3 scripts/compatibility.py update appinfo/info.xml "$(jq -r .next_version <<< "$PLAN")" \
            "$(jq -r .minimum <<< "$PLAN")" "$(jq -r .maximum <<< "$PLAN")"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          base: main
          branch: automation/nextcloud-compatibility
          add-paths: appinfo/info.xml
          commit-message: Update tested Nextcloud compatibility
          title: Support Nextcloud ${{ fromJSON(needs.discover.outputs.plan).minimum }}–${{ fromJSON(needs.discover.outputs.plan).maximum }}
          body: |
            The install, enable, PHPUnit and calendar E2E jobs passed on ${{ join(fromJSON(needs.discover.outputs.plan).matrix, ', ') }}.
            [Test run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for `${{ github.sha }}`.
            Release version is `${{ fromJSON(needs.discover.outputs.plan).next_version }}`.

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [discover, unit, nextcloud]
    concurrency: release-${{ fromJSON(needs.discover.outputs.plan).version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the archive and publish the tested app version
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.discover.outputs.plan }}
        run: scripts/publish-release
