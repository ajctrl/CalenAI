name: CalenAI tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer lint
      - run: composer test

  nextcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.install.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start Nextcloud 35 with the distribution files
        id: install
        run: |
          release_dir="$RUNNER_TEMP/release"
          version=$(scripts/package-release "$release_dir")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          tar -xzf "$release_dir/calenai-$version.tar.gz" -C "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/provision.sh" <<'SH'
          #!/bin/sh
          set -eu
          php occ app:enable calenai
          OC_PASS='Alice-CalenAI-test!1' php occ user:add --password-from-env alice
          OC_PASS='Bob-CalenAI-test!1' php occ user:add --password-from-env bob
          SH
          chmod 755 "$RUNNER_TEMP/provision.sh"
          docker run -d --name calenai-nc -p 127.0.0.1:8080:80 \
            --add-host=host.docker.internal:host-gateway \
            -v "$RUNNER_TEMP/calenai:/var/www/html/custom_apps/calenai" \
            -v "$RUNNER_TEMP/provision.sh:/docker-entrypoint-hooks.d/post-installation/provision.sh:ro" \
            -e SQLITE_DATABASE=nextcloud -e NEXTCLOUD_ADMIN_USER=admin \
            -e NEXTCLOUD_ADMIN_PASSWORD='Adm1n-CalenAI-test!' \
            -e NEXTCLOUD_TRUSTED_DOMAINS=localhost nextcloud:35
          curl --retry 90 --retry-delay 2 --retry-all-errors -fsS http://localhost:8080/status.php
      - name: Run calendar scenarios with a local AI fixture
        run: |
          python3 tests/e2e/mock_ai.py 8765 tests/e2e/requests.jsonl &
          python3 tests/e2e/run.py tests/e2e
      - name: Diagnose Nextcloud startup
        if: failure()
        run: |
          docker logs --tail 60 calenai-nc
          docker exec -u www-data calenai-nc php occ app:list --enabled
          docker exec -u www-data calenai-nc php occ router:list calenai

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, nextcloud]
    concurrency: release-${{ needs.nextcloud.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Publish the tested app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$RUNNER_TEMP/release"
          version=$(scripts/package-release "$release_dir")
          tag="v$version"
          if metadata=$(gh release view "$tag" --json isDraft,targetCommitish); then
            if jq -e '.isDraft == false' <<< "$metadata" >/dev/null; then
              echo "$tag is already published."
              exit 0
            fi
            # Resume an interrupted upload only for this exact revision.
            jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' <<< "$metadata" >/dev/null
          else
            # Refuse to reuse a pre-existing tag at another commit.
            tag_refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")
            jq -e --arg ref "refs/tags/$tag" --arg sha "$GITHUB_SHA" \
              'all(.[]; .ref != $ref or .object.sha == $sha)' <<< "$tag_refs" >/dev/null
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "CalenAI $version" --generate-notes
          fi
          cd "$release_dir"
          gh release upload "$tag" "calenai-$version.tar.gz" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
